<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>

    <title>Signup | Estúdio Personal Cross</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="shortcut icon" href="https://personalcross.github.io/assets/favicon/favicon.png">
    <link rel="stylesheet" href="https://personalcross.github.io/assets/variables.css">
    <link rel="stylesheet" href="https://personalcross.github.io/assets/global-style.css">
    <link rel="stylesheet" href="https://personalcross.github.io/assets/responsive.css">
    <link rel="stylesheet" href="https://personalcross.github.io/assets/components/custom-header.css">
    <link rel="stylesheet" href="https://personalcross.github.io/assets/components/custom-nav.css">
    <link rel="stylesheet" href="https://personalcross.github.io/assets/components/hamburguer.css">
    <link rel="stylesheet" href="https://personalcross.github.io/assets/components/settings.css">
    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <header class="custom-header">
        <nav class="custom-nav">
            <button class="hamburger" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <span class="custom-nav-links"></span> <!-- Dynamically filled by JavaScript -->
        </nav>
    </header>

    <main>
        <section>
            <h4>Registrar novo usuário</h4>
            <form id="signup-form">
                <div class="input-field">
                    <input type="text" id="signup-name" />
                    <label for="signup-name">Nome</label>
                </div>
                <div class="input-field">
                    <input type="email" id="signup-email" required />
                    <label for="signup-email">Email</label>
                </div>
                <div class="input-field">
                    <input type="password" id="signup-password" required />
                    <label for="signup-password">Senha</label>
                </div>
                <div class="modal-footer">
                    <button class="btn waves-effect waves-light" type="submit">Registrar</button>
                </div>
                <div class="error red-text" style="margin-top: 1rem;"></div>
            </form>
        </section>

        <div class="highlight">
            <p>
                Signup
            </p>
        </div>
    </main>
    <footer>
        © 2026 Estúdio Personal Cross · Todos os direitos reservados
    </footer>

    <script src="cs.js"></script>
    <script src="config.js"></script>
    <script src="listener.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

</body>

</html>
